# Cloudflare Workers with static assets.
#
# There is no Worker script: this is a fully static build, so `main` is
# deliberately absent and the [assets] block is the entire deployment. A
# wrangler.toml written for the older Pages flow (pages_build_output_dir) makes
# `wrangler deploy` fail with "Missing entry-point to Worker script or to assets
# directory", because that key is not read by the Workers deploy path.
name = "dfwseo"
compatibility_date = "2026-08-19"

[assets]
directory = "./dist"

# Astro builds directory-style routes (/dallas/roofing/index.html) and a real
# 404.html. Serve that page rather than a bare status so a mistyped market URL
# still lands somewhere with navigation.
not_found_handling = "404-page"

# Trailing slashes are canonicalized in <Head>, so let the platform redirect
# the slashless form rather than serving both.
html_handling = "auto-trailing-slash"
